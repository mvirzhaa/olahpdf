# Nginx Configuration untuk pdf.uika-bogor.ac.id
# Lokasi di server: /etc/nginx/sites-available/pdf.uika-bogor.ac.id.conf

server {
    listen 80;
    listen [::]:80;
    server_name pdf.uika-bogor.ac.id;

    # Batas ukuran upload (sesuai MAX_TOTAL_MB di .env)
    client_max_body_size 300M;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real IP & protocol forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable request buffering agar file besar langsung streaming ke API
        proxy_request_buffering off;
        proxy_buffering off;

        # Timeout panjang untuk file PDF berukuran besar
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

