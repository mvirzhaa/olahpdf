    zoomInner.textContent = '';
    visible().forEach(function (p) { var im = document.createElement('img'); im.src = D.pages[p]; im.alt = 'Halaman ' + (p + 1); zoomInner.appendChild(im); });
    zoom.classList.remove('big'); zoom.classList.add('open'); zoom.scrollTo(0, 0); $('#zoom-close').focus();
  };
  function closeZoom() { zoom.classList.remove('open'); }
  $('#zoom-close').onclick = function (e) { e.stopPropagation(); closeZoom(); };
  zoom.addEventListener('click', function (e) {
    if (e.target.tagName !== 'IMG') { closeZoom(); return; }
    var r = e.target.getBoundingClientRect();
    var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    zoom.classList.toggle('big');
    if (zoom.classList.contains('big')) {
      var r2 = e.target.getBoundingClientRect();
      zoom.scrollTo(r2.left + zoom.scrollLeft + fx * r2.width - innerWidth / 2, r2.top + zoom.scrollTop + fy * r2.height - innerHeight / 2);
    }
  });

  // ── Musik latar ──
  var audio = null, musicWanted = false, musicOn = false, fadeTimer = null;
  var btnMusic = $('#btn-music');
  function dataToBlobUrl(src) {
    if (src.indexOf('data:') !== 0) return src;
    try {
      var comma = src.indexOf(',');
      var bin = atob(src.slice(comma + 1));
      var u8 = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return URL.createObjectURL(new Blob([u8], { type: 'audio/mpeg' }));
    } catch (e) { return src; }
  }
  function fade(to, done) {
    clearInterval(fadeTimer);
    var target = to * (D.music.volume || 0.6);
    fadeTimer = setInterval(function () {
      var v = audio.volume + (target > audio.volume ? 0.04 : -0.04);
      if ((target > audio.volume && v >= target) || (target <= audio.volume && v <= target)) { v = target; clearInterval(fadeTimer); if (done) done(); }
      audio.volume = Math.max(0, Math.min(1, v));
    }, 30);
  }
  function startMusic() {
    if (!audio) { audio = new Audio(dataToBlobUrl(D.music.src)); audio.loop = D.music.loop !== false; audio.preload = 'auto'; }
    audio.volume = 0;
    var p = audio.play();
    musicOn = true;
    if (p && p.then) {
      p.then(function () { btnMusic.classList.remove('waiting'); fade(1); })
       .catch(function () { musicOn = false; btnMusic.classList.add('waiting'); btnMusic.title = 'Ketuk di mana saja untuk memutar musik'; });
    } else fade(1);
  }
  function stopMusic() {
    musicOn = false;
    btnMusic.classList.remove('waiting');
    if (audio && !audio.paused) fade(0, function () { audio.pause(); });
  }
  function setMusic(on) {
    musicWanted = on;
    btnMusic.setAttribute('aria-pressed', String(on));
    btnMusic.title = (on ? 'Matikan musik' : 'Nyalakan musik') + ' (M)';
    if (on) startMusic(); else stopMusic();
    persist();
  }
  if (D.music) {
    btnMusic.hidden = false;
    musicWanted = typeof saved.music === 'boolean' ? saved.music : !!D.music.autoplay;
    btnMusic.setAttribute('aria-pressed', String(musicWanted));
    btnMusic.onclick = function () { setMusic(!musicWanted); };
    // Peramban baru mengizinkan suara setelah ada interaksi pertama
    var unlock = function (e) {
      if (e && e.target && e.target.closest && e.target.closest('#btn-music')) return;
      if (musicWanted && !musicOn) startMusic();
      if (musicOn) { document.removeEventListener('pointerdown', unlock, true); document.removeEventListener('keydown', unlock, true); }
    };
    document.addEventListener('pointerdown', unlock, true);
    document.addEventListener('keydown', unlock, true);
    if (musicWanted) startMusic();
    document.addEventListener('visibilitychange', function () {
      if (!audio) return;
      if (document.hidden) audio.pause();
      else if (musicOn) audio.play().catch(function () {});
    });
  }

  // ── Suara kertas saat halaman dibalik ──
  // Disintesis sekali (tanpa file): hembusan pink-noise yang naik pelan, diredam low-pass,
  // dengan tekstur gesekan tipis dan ketukan lembut saat halaman rebah.
  var sfxOn = !!D.flipSound && saved.sfx !== false, actx = null, sfxBuf = null, lastSfx = 0;
  var btnSfx = $('#btn-sfx');
  if (D.flipSound) {
    btnSfx.hidden = false;
    btnSfx.setAttribute('aria-pressed', String(sfxOn));
    btnSfx.onclick = function () { sfxOn = !sfxOn; btnSfx.setAttribute('aria-pressed', String(sfxOn)); persist(); };
  }
  function synthFlip(sr) {
    var dur = 0.52, n = Math.floor(sr * dur), out = new Float32Array(n), i;
    var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    var x1 = 0, x2 = 0, y1 = 0, y2 = 0, c0 = 0, c2 = 0, d1 = 0, d2 = 0;
    var lp1 = 0, lp2 = 0, thump = 0, tick = 0, tickLp = 0;
    var lpA = 1 - Math.exp(-2 * Math.PI * 3000 / sr);   // peredam desis (low-pass 2 tingkat)
    var thA = 1 - Math.exp(-2 * Math.PI * 160 / sr);
    var tkA = 1 - Math.exp(-2 * Math.PI * 1800 / sr);
    for (i = 0; i < n; i++) {
      var t = i / sr, w = Math.random() * 2 - 1;
      // pink noise (Paul Kellet) — lebih "berudara", tidak mendesis seperti white noise
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856; b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      var pink = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
      if (i % 32 === 0) { // band-pass naik pelan lalu turun: hembusan udara di bawah halaman
        var f = t < 0.15 ? 400 + 1000 * (t / 0.15) : 1400 - 780 * Math.min(1, (t - 0.15) / 0.3);
        var w0 = 2 * Math.PI * f / sr, al = Math.sin(w0) / (2 * 0.6), cs = Math.cos(w0), a0 = 1 + al;
        c0 = al / a0; c2 = -al / a0; d1 = -2 * cs / a0; d2 = (1 - al) / a0;
      }
      var y = c0 * pink + c2 * x2 - d1 * y1 - d2 * y2; x2 = x1; x1 = pink; y2 = y1; y1 = y;
      var env = t < 0.13 ? Math.pow(Math.sin(Math.PI / 2 * t / 0.13), 2) : Math.exp(-(t - 0.13) * 8);
      if (t > dur - 0.08) env *= (dur - t) / 0.08;
      var s = y * env * 2.4;
      // tekstur gesekan kertas yang sangat tipis
      if (Math.random() < 0.0012 * env) tick = (Math.random() * 2 - 1) * 0.5;
      tickLp += tkA * (tick - tickLp); tick *= 0.8; s += tickLp * 0.6;
      // ketukan lembut saat halaman rebah
      var tt = t - 0.34;
      if (tt > 0) { thump += thA * (w - thump); s += thump * Math.exp(-tt * 30) * 2.2 * Math.min(1, tt / 0.012); }
      lp1 += lpA * (s - lp1); lp2 += lpA * (lp1 - lp2);
      out[i] = lp2;
    }
    var peak = 0; for (i = 0; i < n; i++) peak = Math.max(peak, Math.abs(out[i]));
    if (peak > 0) for (i = 0; i < n; i++) out[i] *= 0.5 / peak;
    return out;
  }
  function playSfx() {
    if (!sfxOn) return;
    var now = Date.now();
    if (now - lastSfx < 160) return;   // jangan menumpuk saat membalik cepat
    lastSfx = now;
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
        var data = synthFlip(actx.sampleRate);
        sfxBuf = actx.createBuffer(1, data.length, actx.sampleRate);
        sfxBuf.getChannelData(0).set(data);
      }
      if (actx.state === 'suspended') actx.resume();
      var src = actx.createBufferSource();
      src.buffer = sfxBuf;
      src.playbackRate.value = 0.94 + Math.random() * 0.12;   // variasi kecil agar tidak monoton
      var g = actx.createGain();
      g.gain.value = 0.3 + Math.random() * 0.05;
      src.connect(g); g.connect(actx.destination);
      src.start();
    } catch (e) { /* audio tidak tersedia */ }
  }

  // ── Layar penuh ──
  var root = document.documentElement, btnFull = $('#btn-full');
  var fsEnabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  if (fsEnabled) {
    btnFull.hidden = false;
    btnFull.onclick = function () {
      var el = document.fullscreenElement || document.webkitFullscreenElement;
      if (el) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    };
    var onFs = function () {
      var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
      btnFull.setAttribute('aria-pressed', String(on));
      btnFull.title = (on ? 'Keluar dari layar penuh' : 'Layar penuh') + ' (F)';
    };
    document.addEventListener('fullscreenchange', onFs);
    document.addEventListener('webkitfullscreenchange', onFs);
  }

  // ── Keyboard ──
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (e.key === 'Escape') { if (zoom.classList.contains('open')) closeZoom(); else closePanel(); return; }
    if (zoom.classList.contains('open')) return;
    if (tag === 'input' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': next(); e.preventDefault(); break;
      case 'ArrowLeft': case 'PageUp': prev(); e.preventDefault(); break;
      case 'Home': go(0); e.preventDefault(); break;
      case 'End': go(N - 1); e.preventDefault(); break;
      case 'b': case 'B': $('#btn-mark').click(); break;
      case 'm': case 'M': if (D.music) setMusic(!musicWanted); break;
      case 'f': case 'F': if (fsEnabled) btnFull.click(); break;
      default:
    }
  });

  // ── Lanjutkan dari halaman terakhir ──
  function offerResume() {
    if (hm || !(saved.last > 1) || saved.last >= N) return;
    var pill = document.createElement('div');
    pill.className = 'pill'; pill.setAttribute('role', 'status');
    pill.innerHTML = '<span>Lanjutkan dari halaman ' + (saved.last + 1) + '?</span>';
    var yes = document.createElement('button'); yes.type = 'button'; yes.className = 'primary'; yes.textContent = 'Lanjutkan';
    var no = document.createElement('button'); no.type = 'button'; no.textContent = 'Dari awal';
    var close = function () { pill.remove(); };
    yes.onclick = function () { close(); go(saved.last); };
    no.onclick = close;
    pill.appendChild(yes); pill.appendChild(no);
    document.body.appendChild(pill);
    setTimeout(close, 12000);
  }

  // ── Mulai ──
  setMarkUI(); renderMarks(); renderThumbMarks(); refresh();
  var loader = $('#loader'), bar = loader.querySelector('span');
  if (D.thumbs && D.thumbs[0]) { var lc = $('#loader-cover'); lc.src = D.pages[0]; lc.hidden = false; }
  var first = visible().map(function (p) { ensure(p); return imgs[p]; });
  var loaded = 0;
  function oneDone() { loaded++; bar.style.width = (loaded / first.length * 100) + '%'; }
  Promise.all(first.map(function (im) {
    return (im.decode ? im.decode() : Promise.resolve()).catch(function () {}).then(oneDone);
  })).then(function () {
    setTimeout(function () { loader.classList.add('done'); offerResume(); }, 150);
  });
})();
</script>
</body>
</html>
